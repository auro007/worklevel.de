plugins {
    id "com.android.application"
}

android {
    namespace "de.worklevel.app"
    compileSdk 35

    defaultConfig {
        applicationId "de.worklevel.app"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
